app = "pump-royale"
primary_region = "iad"
# Let open matches see the shutdown notice before the machine stops.
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  LOG_LEVEL = "info"

# Live matches are held in memory: run exactly one machine (fly scale count 1).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 800

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
